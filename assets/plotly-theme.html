<script>
(function () {
  "use strict";

  function isDarkTheme() {
    return document.body.classList.contains("quarto-dark") ||
      document.documentElement.getAttribute("data-bs-theme") === "dark";
  }

  function chartMeta(plot) {
    return (plot && plot.layout && plot.layout.meta) || {};
  }

  function fallbackPalette(dark) {
    return dark
      ? {
          naive: "#FBBF24",
          buy_hold: "#14B8A6",
          cash: "#C084FC",
          actual: "#22C55E",
          price: "#F59E0B",
          positive: "#4ADE80",
          negative: "#FB7185",
          accent: "#38BDF8",
          neutral: "#94A3B8",
          grid: "#465266",
          text: "#F3F4F6"
        }
      : {
          naive: "#B45309",
          buy_hold: "#0F766E",
          cash: "#7C3AED",
          actual: "#15803D",
          price: "#B45309",
          positive: "#16A34A",
          negative: "#BE123C",
          accent: "#0369A1",
          neutral: "#64748B",
          grid: "#D1D5DB",
          text: "#111827"
        };
  }

  function rolePalette(plot) {
    const dark = isDarkTheme();
    const palettes = chartMeta(plot).palettes || {};
    return palettes[dark ? "dark" : "light"] || fallbackPalette(dark);
  }

  function themeColours(plot) {
    const dark = isDarkTheme();
    const bodyStyle = window.getComputedStyle(document.body);
    const palette = rolePalette(plot);
    const pageBackground = bodyStyle.backgroundColor ||
      (dark ? "#212121" : "#FFFFFF");
    const pageText = bodyStyle.color || palette.text;

    return dark
      ? {
          page: pageBackground,
          plot: pageBackground,
          text: pageText,
          grid: palette.grid || "#465266",
          axis: palette.neutral || "#CBD5E1",
          slider: "rgba(148,163,184,0.14)",
          sliderBorder: "rgba(203,213,225,0.45)",
          button: "rgba(248,250,252,0.97)",
          buttonText: "#0F172A",
          buttonActive: "rgba(253,224,71,0.97)",
          hover: "rgba(17,24,39,0.98)"
        }
      : {
          page: pageBackground,
          plot: pageBackground,
          text: pageText,
          grid: palette.grid || "#D1D5DB",
          axis: palette.neutral || "#4B5563",
          slider: "rgba(107,114,128,0.10)",
          sliderBorder: "rgba(75,85,99,0.35)",
          button: "rgba(255,255,255,0.98)",
          buttonText: "#0F172A",
          buttonActive: "rgba(253,224,71,0.97)",
          hover: "rgba(255,255,255,0.98)"
        };
  }

  function roleOf(trace) {
    if (!trace || !trace.meta) return null;
    return trace.meta.book_role || null;
  }

  function alphaColour(hex, alpha) {
    if (typeof hex !== "string" || !/^#[0-9a-f]{6}$/i.test(hex)) return hex;
    const red = parseInt(hex.slice(1, 3), 16);
    const green = parseInt(hex.slice(3, 5), 16);
    const blue = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + red + "," + green + "," + blue + "," + alpha + ")";
  }

  function restyleTrace(plot, trace, index, palette, colours) {
    const role = roleOf(trace);
    const update = {
      "hoverlabel.bgcolor": colours.hover,
      "hoverlabel.font.color": colours.text,
      "hoverlabel.bordercolor": colours.axis
    };

    if (role && palette[role]) {
      if (trace.line) update["line.color"] = palette[role];
      if (trace.marker) update["marker.color"] = palette[role];
      if (trace.fill && trace.fill !== "none") {
        const alpha = trace.meta.book_fill_alpha || 0.14;
        update.fillcolor = alphaColour(palette[role], alpha);
      }
    }

    if ((trace.mode || "").indexOf("text") >= 0 || trace.textfont) {
      update["textfont.color"] = colours.text;
    }

    if (trace.type === "histogram2d" || role === "density") {
      update.colorscale = isDarkTheme()
        ? [[0, "#13213A"], [0.25, "#1D4ED8"], [0.6, "#38BDF8"], [1, "#FBBF24"]]
        : [[0, "#F8FAFC"], [0.25, "#BFDBFE"], [0.6, "#0284C7"], [1, "#7C2D12"]];
      update["colorbar.tickfont.color"] = colours.text;
      update["colorbar.title.font.color"] = colours.text;
    }

    Plotly.restyle(plot, update, [index]);
  }

  function mappedThemeColour(value, plot) {
    if (typeof value !== "string") return value;
    const palettes = chartMeta(plot).palettes || {};
    const darkPalette = palettes.dark || fallbackPalette(true);
    const activePalette = rolePalette(plot);
    const roles = Object.keys(darkPalette);
    for (let i = 0; i < roles.length; i += 1) {
      const role = roles[i];
      if (darkPalette[role] === value && activePalette[role]) {
        return activePalette[role];
      }
    }
    return value;
  }

  function themeUpdate(plot) {
    const colours = themeColours(plot);
    const palette = rolePalette(plot);
    const compact = Math.max(320, plot.clientWidth || 720) < 600;
    const update = {
      paper_bgcolor: colours.page,
      plot_bgcolor: colours.plot,
      "font.color": colours.text,
      "title.font.color": colours.text,
      "title.font.size": compact ? 16 : 19,
      "legend.font.color": colours.text,
      "legend.font.size": compact ? 11 : 13,
      "hoverlabel.bgcolor": colours.hover,
      "hoverlabel.font.color": colours.text,
      "hoverlabel.bordercolor": colours.axis
    };

    Object.keys(plot.layout || {}).forEach(function (key) {
      if (!/^xaxis\d*$/.test(key) && !/^yaxis\d*$/.test(key)) return;
      update[key + ".color"] = colours.text;
      update[key + ".tickfont.color"] = colours.text;
      update[key + ".tickfont.size"] = compact ? 11 : 13;
      update[key + ".title.font.color"] = colours.text;
      update[key + ".title.font.size"] = compact ? 12 : 15;
      update[key + ".gridcolor"] = colours.grid;
      update[key + ".linecolor"] = colours.axis;
      update[key + ".zerolinecolor"] = colours.axis;

      if (/^xaxis\d*$/.test(key) && plot.layout[key].rangeslider) {
        update[key + ".rangeslider.bgcolor"] = colours.slider;
        update[key + ".rangeslider.bordercolor"] = colours.sliderBorder;
      }

      if (/^xaxis\d*$/.test(key) && plot.layout[key].rangeselector) {
        update[key + ".rangeselector.bgcolor"] = colours.button;
        update[key + ".rangeselector.activecolor"] = colours.buttonActive;
        update[key + ".rangeselector.bordercolor"] = colours.axis;
        update[key + ".rangeselector.font.color"] = colours.buttonText;
        update[key + ".rangeselector.font.size"] = compact ? 11 : 12;
      }
    });

    const currentMargin = plot.layout.margin || {};
    const currentLeft = Number(currentMargin.l) || 72;
    const currentRight = Number(currentMargin.r) || 18;
    update["margin.l"] = compact
      ? Math.min(82, Math.max(54, currentLeft))
      : Math.max(60, currentLeft);
    update["margin.r"] = compact
      ? Math.min(24, Math.max(12, currentRight))
      : Math.min(36, Math.max(14, currentRight));

    (plot.layout.annotations || []).forEach(function (_, index) {
      update["annotations[" + index + "].font.color"] = colours.text;
    });

    (plot.layout.shapes || []).forEach(function (shape, index) {
      if (!shape || !shape.line) return;
      const mapped = mappedThemeColour(shape.line.color, plot);
      if (mapped) update["shapes[" + index + "].line.color"] = mapped;
    });

    Plotly.relayout(plot, update);

    (plot.data || []).forEach(function (trace, index) {
      restyleTrace(plot, trace, index, palette, colours);
    });
  }

  function visibleNumericYRange(plot, xMin, xMax) {
    let yMin = Infinity;
    let yMax = -Infinity;

    (plot.data || []).forEach(function (trace) {
      if (!trace || trace.visible === "legendonly") return;
      if (!trace.x || !trace.y) return;
      const traceType = trace.type || "scatter";
      if (traceType.indexOf("scatter") !== 0) return;

      const n = Math.min(trace.x.length || 0, trace.y.length || 0);
      for (let i = 0; i < n; i += 1) {
        const xVal = new Date(trace.x[i]).getTime();
        const yVal = Number(trace.y[i]);
        if (!Number.isFinite(xVal) || !Number.isFinite(yVal)) continue;
        if (xVal >= xMin && xVal <= xMax) {
          if (yVal < yMin) yMin = yVal;
          if (yVal > yMax) yMax = yVal;
        }
      }
    });

    if (!Number.isFinite(yMin) || !Number.isFinite(yMax)) return null;

    if (yMin === yMax) {
      const pad = Math.abs(yMin) > 0 ? Math.abs(yMin) * 0.08 : 1;
      return [yMin - pad, yMax + pad];
    }

    const pad = (yMax - yMin) * 0.10;
    return [yMin - pad, yMax + pad];
  }

  function resizePlot(plot) {
    if (!window.Plotly || !plot) return;
    const container = plot.parentElement || plot;
    const width = Math.max(320, container.clientWidth || plot.clientWidth || 720);
    const meta = chartMeta(plot);
    const compact = width < 600;
    const ratio = Number(compact ? meta.mobile_aspect_ratio : meta.aspect_ratio) ||
      (compact ? 1.18 : 0.92);
    const minHeight = Number(compact ? meta.mobile_min_height : meta.min_height) ||
      (compact ? 560 : 620);
    const maxHeight = Number(compact ? meta.mobile_max_height : meta.max_height) ||
      (compact ? 900 : 980);
    const height = Math.min(maxHeight, Math.max(minHeight, Math.round(width * ratio)));

    plot.style.height = height + "px";
    Plotly.relayout(plot, { height: height, autosize: true });
  }

  function bindAutoY(plot) {
    if (!window.Plotly || !plot || !plot.layout) return;
    if (plot.__bookAutoYBound) return;
    if (!(chartMeta(plot).auto_y_on_x === true)) return;

    plot.__bookAutoYBound = true;
    let updating = false;

    plot.on("plotly_relayout", function (eventData) {
      if (updating) return;
      const keys = Object.keys(eventData || {});
      const xChanged = keys.some(function (key) {
        return key.indexOf("xaxis.range") === 0 || key === "xaxis.autorange";
      });
      if (!xChanged) return;

      if (eventData["xaxis.autorange"] === true) {
        updating = true;
        Plotly.relayout(plot, { "yaxis.autorange": true })
          .finally(function () { updating = false; });
        return;
      }

      const xRange = plot.layout.xaxis && plot.layout.xaxis.range;
      if (!Array.isArray(xRange) || xRange.length !== 2) return;

      const xMin = new Date(xRange[0]).getTime();
      const xMax = new Date(xRange[1]).getTime();
      if (!Number.isFinite(xMin) || !Number.isFinite(xMax)) return;

      const yRange = visibleNumericYRange(plot, xMin, xMax);
      if (!yRange) return;

      updating = true;
      Plotly.relayout(plot, { "yaxis.range": yRange })
        .finally(function () { updating = false; });
    });
  }

  function preparePlot(plot) {
    if (!window.Plotly || !plot || !plot.layout) return;
    themeUpdate(plot);
    resizePlot(plot);
    bindAutoY(plot);
  }

  function prepareAllPlots() {
    document.querySelectorAll(".js-plotly-plot").forEach(preparePlot);
  }

  let resizeTimer = null;
  window.addEventListener("resize", function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      document.querySelectorAll(".js-plotly-plot").forEach(function (plot) {
        resizePlot(plot);
        themeUpdate(plot);
      });
    }, 160);
  });

  document.addEventListener("DOMContentLoaded", function () {
    [80, 300, 900].forEach(function (delay) {
      window.setTimeout(prepareAllPlots, delay);
    });
  });

  document.addEventListener("quarto:themeChanged", function () {
    window.setTimeout(prepareAllPlots, 40);
  });

  document.addEventListener("click", function (event) {
    if (!event.target.closest(".quarto-color-scheme-toggle")) return;
    window.setTimeout(prepareAllPlots, 120);
  });
})();
</script>
